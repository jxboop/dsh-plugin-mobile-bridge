<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>计时</title>
<style>
	body { margin: 0; padding: 16px; font: 15px/1.7 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0f1620; color: #e8eef7; text-align: center }
	.big { font: 700 56px/1.1 ui-monospace, Menlo, monospace; margin: 18px 0; font-variant-numeric: tabular-nums }
	.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap }
	button { font: inherit; padding: 9px 16px; border-radius: 10px; border: 1px solid #2d425c; background: #1b2734; color: inherit }
	button.primary { background: #2ecc71; color: #04213d; border-color: transparent; font-weight: 700 }
	.hint { color: #7f93ad; font-size: 12px; margin-top: 10px }
</style>
<h1 style="font-size:15px;color:#9fb3d0">计时（3.1.0 示例面板 · 整屏）</h1>
<div class="big" id="clock">25:00</div>
<div class="row">
	<button class="primary" id="toggle">开始</button>
	<button id="reset">归零</button>
	<button id="minus">−1 分</button>
	<button id="plus">+1 分</button>
</div>
<div class="hint">纯手机端的面板示范 ✓（不碰电脑 ✓）。到点会振动一下（如果浏览器给 ✓）。</div>
<script>
	let left = 25 * 60
	let timer = 0
	const clock = document.getElementById('clock')
	const toggle = document.getElementById('toggle')
	const paint = () => {
		const m = String(Math.floor(left / 60)).padStart(2, '0')
		const s = String(left % 60).padStart(2, '0')
		clock.textContent = m + ':' + s
	}
	const stop = () => { if (timer) { clearInterval(timer); timer = 0; toggle.textContent = '开始' } }
	toggle.onclick = () => {
		if (timer) { stop(); return }
		toggle.textContent = '暂停'
		timer = setInterval(() => {
			left -= 1
			if (left <= 0) {
				left = 0
				paint()
				stop()
				try { navigator.vibrate?.(400) } catch { /* 无所谓 */ }
				clock.textContent = '时间到'
				return
			}
			paint()
		}, 1000)
	}
	document.getElementById('reset').onclick = () => { stop(); left = 25 * 60; paint() }
	document.getElementById('minus').onclick = () => { stop(); left = Math.max(60, left - 60); paint() }
	document.getElementById('plus').onclick = () => { stop(); left = Math.min(90 * 60, left + 60); paint() }
	paint()
</script>
