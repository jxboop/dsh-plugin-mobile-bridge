<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>便签</title>
<style>
	body { margin: 0; padding: 14px; font: 15px/1.7 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0f1620; color: #e8eef7 }
	h1 { font-size: 15px; margin: 0 0 6px; color: #9fb3d0; font-weight: 600 }
	textarea { width: 100%; box-sizing: border-box; min-height: 45vh; background: #16202c; color: inherit; border: 1px solid #26374d; border-radius: 10px; padding: 10px; font: inherit; resize: vertical }
	.row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap }
	button { font: inherit; padding: 7px 14px; border-radius: 9px; border: 1px solid #2d425c; background: #1b2734; color: inherit }
	.hint { color: #7f93ad; font-size: 12px; margin-top: 8px }
</style>
<h1>便签（3.1.0 示例面板）</h1>
<textarea id="note" placeholder="随手记一句 —— 存在这台手机的浏览器里（localStorage）"></textarea>
<div class="row"><button id="clear">清空</button><span class="hint" id="state"></span></div>
<div class="hint">示范协议：一个目录 + 一个 panel.json 就能挂进手机 UI ✓（这个面板只用浏览器本地存储，不碰电脑 ✓）。</div>
<script>
	const note = document.getElementById('note')
	const state = document.getElementById('state')
	const KEY = 'panel.notes.text'
	try { note.value = localStorage.getItem(KEY) || '' } catch { state.textContent = '（这个浏览器不给本地存储）' }
	note.addEventListener('input', () => {
		try { localStorage.setItem(KEY, note.value); state.textContent = '已存在手机本地 ✓ ' + new Date().toLocaleTimeString() } catch { state.textContent = '存不下（无痕模式？）' }
	})
	document.getElementById('clear').onclick = () => {
		note.value = ''
		try { localStorage.removeItem(KEY) } catch { /* 无所谓 */ }
		state.textContent = '清空了 ✓'
	}
</script>
